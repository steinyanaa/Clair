name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: Clair version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.7, MacBook Air M4 16 GB"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Audio source
      options: [Microphone, System audio, Imported file, Not related]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove any class content you do not want to publish.
