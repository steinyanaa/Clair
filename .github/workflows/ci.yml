name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compile and unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun swiftc --version
      - name: Compile app (warnings are errors)
        run: |
          scripts/build.sh --compile-only 2>&1 | tee build.log
          ! grep -E "warning:" build.log
      - name: Unit tests
        run: scripts/test.sh
